<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hostpulse</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <!-- an activity pulse: the one mark that says what this thing is -->
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
    </svg>
    <h1>hostpulse</h1>
  </div>
  <div class="actions">
    <button id="add-btn" class="primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="add_server">افزودن سرور</span>
    </button>
    <button id="groups-btn" title="گروه‌ها">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span data-i18n="groups">گروه‌ها</span>
    </button>
    <button id="lang-btn" title="زبان / Language">English</button>
    <a href="/logout" class="btn" data-i18n="logout">خروج</a>
  </div>
</header>

<main>
  <div id="board"></div>
  <p id="empty" class="empty" hidden data-i18n="empty">هنوز سروری اضافه نشده.</p>
</main>

<!-- groups -->
<div id="groupsheet" class="modal" hidden>
  <div class="sheet">
    <div class="sheet-head"><h2 data-i18n="g_title">گروه‌ها</h2>
      <button class="close" data-i18n="close">بستن</button></div>
    <p class="sub" data-i18n="g_sub">گروه بساز و بعد کارت سرورها را با کشیدن داخلشان بگذار.</p>
    <div class="row">
      <label class="grow"><span data-i18n="g_new">نام گروه تازه</span>
        <input id="g-name" data-i18n-ph="g_new_ph" placeholder="مثلاً سرورهای کردیتی"></label>
      <button id="g-add" class="primary" data-i18n="g_make">بساز</button>
    </div>
    <div id="g-list" class="glist"></div>
    <div id="g-msg" class="msg" hidden></div>
  </div>
</div>

<!-- server detail -->
<div id="detail" class="modal" hidden>
  <div class="sheet wide">
    <div class="sheet-head">
      <h2 id="d-name"></h2>
      <div>
        <span class="seg">
          <button data-range="1h">۱ ساعت</button>
          <button data-range="6h">۶ ساعت</button>
          <button data-range="24h" class="on">۲۴ ساعت</button>
          <button data-range="7d">۷ روز</button>
          <button data-range="30d">۳۰ روز</button>
        </span>
        <button class="close" data-i18n="close">بستن</button>
      </div>
    </div>
    <div id="d-stats" class="stats"></div>
    <p id="d-thin" class="thin" hidden data-i18n="thin"></p>
    <div class="charts">
      <div class="chart"><h3 data-i18n="cpu_mem">پردازنده و حافظه (٪)</h3><canvas id="c-cpu"></canvas></div>
      <div class="chart"><h3 id="net-title">پهنای باند</h3><canvas id="c-net"></canvas></div>
      <div class="chart"><h3 data-i18n="disk_use">مصرف دیسک (٪)</h3><canvas id="c-disk"></canvas></div>
    </div>
  </div>
</div>

<!-- add / edit -->
<div id="form" class="modal" hidden>
  <div class="sheet">
    <div class="sheet-head"><h2 id="f-title">افزودن سرور</h2>
      <button class="close" data-i18n="close">بستن</button></div>
    <label><span data-i18n="f_name">نام</span> <input id="f-name" data-i18n-ph="f_name_ph" placeholder="مثلاً سرور آلمان"></label>
    <div class="row">
      <label class="grow"><span data-i18n="f_host">آدرس</span> <input id="f-host" dir="ltr" placeholder="1.2.3.4"></label>
      <label class="narrow"><span data-i18n="f_port">پورت</span> <input id="f-port" dir="ltr" value="22"></label>
    </div>
    <label><span data-i18n="f_user">نام کاربری</span> <input id="f-user" dir="ltr" value="root"></label>
    <label><span data-i18n="f_group">گروه</span> <select id="f-group"></select></label>

    <div class="tabs">
      <button data-auth="password" class="on" data-i18n="auth_password">رمز عبور</button>
      <button data-auth="key" data-i18n="auth_key">کلید خصوصی SSH</button>
    </div>

    <div id="pane-password">
      <label><span data-i18n="auth_password">رمز عبور</span> <input id="f-password" type="password" dir="ltr"></label>
    </div>
    <div id="pane-key" hidden>
      <label><span data-i18n="f_key">کلید خصوصی</span>
        <textarea id="f-key" dir="ltr" rows="7"
          placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea></label>
      <label><span data-i18n="f_passphrase">عبارت عبور کلید</span> <span class="hint" data-i18n="f_passphrase_hint">(اگر کلید رمز دارد)</span>
        <input id="f-passphrase" type="password" dir="ltr"></label>
    </div>

    <div id="f-msg" class="msg" hidden></div>
    <div class="sheet-foot">
      <button id="f-test" data-i18n="test">تست اتصال</button>
      <button id="f-save" class="primary" data-i18n="save">ذخیره</button>
      <button id="f-delete" class="danger" hidden data-i18n="del">حذف</button>
    </div>
  </div>
</div>

<div id="boot-error" class="boot-error" hidden></div>
<script>
/* A script that fails to parse takes the whole panel with it, and the symptom
   is silence: cards never render and buttons appear dead. Say so instead. */
(function () {
  var show = function (what) {
    var el = document.getElementById('boot-error');
    el.textContent = 'پنل بالا نیامد — ' + what +
      '. صفحه را با Ctrl+Shift+R تازه کن؛ اگر باز هم بود، خطا در کنسول مرورگر است.';
    el.hidden = false;
  };
  window.addEventListener('error', function (e) {
    if (e.filename && e.filename.indexOf('/static/') !== -1) show('خطا در اسکریپت');
  });
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      if (!window.__hostpulseReady) show('اسکریپت اجرا نشد');
    }, 2500);
  });
})();
</script>
<script src="/static/i18n.js"></script>
<script src="/static/chart.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
